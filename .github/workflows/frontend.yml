name: AWS regional-production - Publish frontend
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful AWS Build release workflow run ID (also used for rollback)
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: aws-regional-production-frontend
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["refs/heads/main","refs/heads/regional-production","refs/heads/codex/regional-production"]'), github.ref)
    environment: release
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify source workflow and release status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq 'select(.path == ".github/workflows/release.yml" and (.head_branch == "main" or .head_branch == "regional-production" or .head_branch == "codex/regional-production") and .conclusion == "success") | .id' | grep -qx "$RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Smoke-test every advertised region
        run: |
          bun install --frozen-lockfile
          bun run build:shared
          node scripts/check-release-regions.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.ARTIFACT_REGION }}
      - name: Publish assets, then entrypoint
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync release/client "s3://$BUCKET" --exclude index.html --exclude 'assets/*' --cache-control 'public,max-age=3600'
          aws s3 sync release/client/assets "s3://$BUCKET/assets" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp release/client/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache,no-store,must-revalidate' --content-type text/html
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /index.html /
