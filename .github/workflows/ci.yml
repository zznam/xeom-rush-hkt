name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    # DynamoDB services require Docker; the optional isolated local runner has no Docker daemon.
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run test

      - name: Build default legacy client
        run: bun run build:client:legacy

      - name: Validate opt-in AWS client build
        env:
          VITE_REGIONS_JSON: '[{"id":"ap-southeast-1","label":"Singapore","apiUrl":"https://sg.example.com"}]'
        run: bun run build:client:regional

      - name: Build server
        run: bun run build:server

      - name: Build Cloudflare room runtime
        run: bun run --filter '@xeom-rush/room-service' build

      - name: Test Cloudflare and routed DynamoDB room owners
        env:
          TEST_DYNAMO_URL: http://127.0.0.1:8000
        run: bun run --filter '@xeom-rush/room-service' test

      - name: Test legacy Deno deployment
        run: node tests/legacy-smoke.mjs

      - name: Test regional routing and matchmaking
        run: node tests/regional-smoke.mjs

      - name: Test Deno persistence
        run: deno test --no-check --allow-read --allow-write --allow-env --allow-sys --unstable-kv tests/deno-kv.test.ts

      - name: Install browser
        run: bun run --filter e2e install:browsers

      - name: Test browser flows
        run: bun run test:e2e && bun run test:e2e:regional && bun run --filter e2e test --config=playwright.rooms.config.ts

      - name: Combined runtime and browser load smoke
        env:
          TEST_DYNAMO_URL: http://127.0.0.1:8000
          SOAK_PUBLIC_HUMANS: 16
          SOAK_DURATION_MS: 10000
          SOAK_OUTPUT: apps/e2e/test-results/load-smoke.json
        run: node tests/release-soak.mjs

      - name: Save browser and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: apps/e2e/test-results/

  deno-deploy-build:
    name: Build in Deno-only environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the configured deployment commands without preinstalled Bun or Node.js
        run: |
          docker run --rm -v "$PWD:/app" -w /app denoland/deno:2.7.14 eval '
            const { deploy } = JSON.parse(await Deno.readTextFile("deno.json"));
            for (const step of ["install", "build"]) {
              const result = await new Deno.Command("sh", { args: ["-ec", deploy[step]] }).spawn().status;
              if (!result.success) Deno.exit(result.code);
            }
          '

  infrastructure:
    name: Validate infrastructure and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/region init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/region validate
      - run: terraform -chdir=infra/region test
      - run: docker build -t xeom-ci .
      - name: Verify production image starts with its runtime dependencies
        run: |
          docker run -d --name xeom-ci -p 3002:3002 -e NODE_ENV=development -e MONGODB_URI=mongodb://127.0.0.1:1/test -e BOT_COUNT=0 xeom-ci
          trap 'docker logs xeom-ci; docker rm -f xeom-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3002/api/ready; then exit 0; fi
            sleep 2
          done
          exit 1
